name: Build local client

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: fishcloud-local-macos
          - os: windows-latest
            artifact: fishcloud-local-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r desktop/requirements-build.txt
      - name: Build local client
        run: python desktop/build.py
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          hdiutil create -volname "鱼智云本地客户端" -srcfolder dist-desktop -ov -format UDZO release/FishCloudLocal.dmg
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path 'dist-desktop/*' -DestinationPath 'release/FishCloudLocal-windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/
