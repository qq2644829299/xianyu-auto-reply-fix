name: Build local client

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      # Keep producing the macOS installer even if the independent Windows
      # package happens to fail.
      fail-fast: false
      matrix:
        include:
          # macos-13 is GitHub's Intel runner.  The current customer machine
          # is an Intel MacBook Pro and cannot run an Apple-silicon build.
          - os: macos-13
            artifact: fishcloud-local-macos
          - os: windows-latest
            artifact: fishcloud-local-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r desktop/requirements-build.txt
      - name: Build local client
        run: python desktop/build.py
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          # UDRO is a directly mountable read-only DMG.  Avoiding the slow
          # compression pass keeps Intel builds from spending many minutes at
          # the final packaging step.
          hdiutil create -volname "鱼智云本地客户端" -srcfolder dist-desktop -ov -format UDRO release/FishCloudLocal.dmg
          hdiutil verify release/FishCloudLocal.dmg
          ls -lh release/FishCloudLocal.dmg
      - name: Package Windows application
        if: runner.os == 'Windows'
        run: python desktop/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/
          # The macOS installer is already a disk image.  Re-compressing a
          # large DMG inside the artifact adds several minutes and has been
          # the source of stalled Mac packaging runs.  Preserve it as-is.
          compression-level: 0
