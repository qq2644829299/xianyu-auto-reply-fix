# ======================================================================
# 浏览器态 IM 会话（移植自「鱼店长Pro」的 CefSharp + JS 注入方案）
# ======================================================================
# enabled: 开启后 IM WebSocket 由常驻浏览器页面建立并维护，
#          Python 侧不再直连 wss、不再自行刷 token，可根除反复弹验证码。
BROWSER_IM:
  enabled: true
  headless: true                  # 首次登录或需要人工过验证码时改 false
  disconnect_grace_seconds: 60    # 断开后给页面自愈的宽限（对齐鱼店长 60 秒）
  periodic_refresh_seconds: 3600  # 客服页周期整页重载（对齐鱼店长 60 分钟）
  silence_refresh_seconds: 900    # IM 通道静默多久判定为假在线
  reload_cooldown_seconds: 90     # 两次刷新最小间隔
  max_reload_per_hour: 8          # 每小时刷新上限，防刷新风暴
  skip_legacy_heartbeat: true     # 浏览器模式下停发 /! 心跳（页面自身维持）
  reuse_single_connection: true   # 发消息复用同一连接，避免频繁新建 WSS 触发风控
  startup_timeout_seconds: 90     # 等待页面建立 IM WS 的上限
  captcha_selfheal_first: true    # 出验证码先走浏览器自愈，滑块只作保底
  fallback_to_direct_ws: true     # 浏览器起不来时回退原直连逻辑
  reuse_persistent_browser: true  # 复用 utils/persistent_browser 常驻浏览器，避免重复开 Chromium
  executable_path: ''             # 浏览器路径；留空自动探测（容器内为 /usr/bin/chromium）
  qr_login_in_browser: true      # 扫码走常驻浏览器（同 profile，避免取 cookie 失败）
  qr_timeout_seconds: 180        # 二维码有效期（秒）

# ======================================================================
# 页内自动滑块（对应「鱼店长Pro」的 EnableAutoVerify / SliderVerify）
# ======================================================================
# 滑块在同一已登录浏览器会话内完成，cookie 与指纹一致，平台才认这次验证。
AUTO_SLIDER:
  enabled: true                    # 自动滑块总开关
  max_attempts: 3                  # 单轮最多尝试次数
  retry_interval_seconds: 5        # 首次重试间隔（逐次递增）
  drag_timeout_seconds: 20         # 单次拖动后等待判定时长
  headful_manual_wait_seconds: 90  # 有头模式下自动失败后留给人工的时长
  notify_on_repeat_fail: true      # 反复失败时通知
  rotate_page_before_retry: true   # 每次重试前刷新验证页拿新 puzzle

# ======================================================================
# 账号自动登录与状态维护（对应 EnableAutoLogin / EnableReloadKefuWhenNetBreak）
# ======================================================================
# 登录在常驻浏览器内完成：切账号密码登录 -> 勾隐私条款 -> 填账号密码 -> 点登录。
# 凭据加密存 cookies.username / cookies.password，会话失效时按退避策略重登。
ACCOUNT_STATE:
  auto_login_enabled: true            # 自动登录总开关（EnableAutoLogin）
  auto_login_on_startup: true         # 启动时无有效 cookie 就用凭据登录
  relogin_on_session_invalid: true    # 会话失效时自动重登
  max_login_attempts: 3               # 连续失败上限，超过转人工
  login_backoff_seconds: 180          # 首次失败退避，之后翻倍
  login_backoff_max_seconds: 3600     # 退避上限
  verify_retry_min: 15                # VerifyRetryMin（分钟）
  reload_kefu_when_net_break: true    # 断网时重载客服页
  reply_deadline_warn_days: 3         # 授权到期前提醒天数
  login_timeout_seconds: 60           # 单次登录等待上限


